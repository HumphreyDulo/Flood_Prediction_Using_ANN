<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css')}}"> <!-- Link to your CSS file -->
    <script>
        // Function to validate password match
        function validatePassword() {
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirm_password").value;
            var matchFeedback = document.getElementById("password-match-feedback");
            
            // If passwords don't match
            if (password !== confirmPassword) {
                matchFeedback.innerHTML = "Passwords do not match!";
                matchFeedback.style.color = "red";
                document.getElementById("confirm_password").style.borderColor = "red";
                return false;
            } else {
                matchFeedback.innerHTML = "Passwords match!";
                matchFeedback.style.color = "green";
                document.getElementById("confirm_password").style.borderColor = "green";
                return true;
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
                {% for category, message in messages %}
                    <li class="alert alert-{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        {% endwith %}

        <!-- Register Form -->
        <div class="card">
            <div class="card-header">Register</div>
            <div class="card-body">
                <form method="POST" action="/register" onsubmit="return validatePassword()">
                    <div class="form-group">
                        <input
                            type="text"
                            name="name"
                            class="search-bar"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <input
                            type="email"
                            name="email"
                            class="search-bar"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="search-bar"
                            placeholder="Enter your password"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <input
                            type="password"
                            name="confirm_password"
                            id="confirm_password"
                            class="search-bar"
                            placeholder="Confirm your password"
                            required
                            oninput="validatePassword()"
                        >
                        <div id="password-match-feedback" style="font-size: 12px; margin-top: 5px;"></div>
                    </div>
                    <button type="submit" class="styled-button">Register</button>
                </form>
                <p class="text-info">
                    Already have an account? 
                    <a href="{{url_for('login')}}" style="color: #bfaff2;">Login here</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
